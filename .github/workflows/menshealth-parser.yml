name: 📰 Парсер Men's Health с рерайтингом

on:
  workflow_dispatch:

jobs:
  parse-and-publish:
    name: Парсинг и публикация статей
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    
    steps:
      - name: Клонирование репозитория fitness-timer-autopost
        uses: actions/checkout@v5
        with:
          path: fitness-timer-autopost
      
      - name: Клонирование репозитория tabatatimer-ru (public_html)
        uses: actions/checkout@v5
        with:
          repository: VR-Lounge/tabatatimer-ru
          path: public_html
          # Публичный репозиторий: не подставлять битый PAT поверх GITHUB_TOKEN
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Установка зависимостей
        working-directory: fitness-timer-autopost
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Восстановление состояния (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            fitness-timer-autopost/.menshealth_processed.json
            fitness-timer-autopost/.content_hashes.json
            fitness-timer-autopost/.telegram_recent.json
            fitness-timer-autopost/.publication_logs.json
          key: menshealth-state-${{ github.run_id }}
          restore-keys: |
            menshealth-state-
      
      - name: Создание структуры директорий
        run: |
          mkdir -p public_html/blog
          echo "✅ Структура директорий создана"
      
      - name: Запуск парсера Men's Health
        working-directory: fitness-timer-autopost
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Всегда публикуем на сайт вместе с постом
          PUBLISH_TO_BLOG: "true"
        run: |
          python3 menshealth_parser.py
      
      - name: Генерация HTML страниц для блога
        working-directory: fitness-timer-autopost
        run: |
          python3 generate_blog_post_page.py
      
      - name: Установка AWS CLI для Яндекс Cloud
        working-directory: fitness-timer-autopost
        run: |
          pip install awscli
      
      - name: Загрузка файлов блога на Яндекс Cloud
        working-directory: fitness-timer-autopost
        env:
          YANDEX_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          YANDEX_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$YANDEX_ACCESS_KEY_ID" ] || [ -z "$YANDEX_SECRET_ACCESS_KEY" ]; then
            echo "❌ Секреты YANDEX_ACCESS_KEY_ID / YANDEX_SECRET_ACCESS_KEY не заданы"
            exit 1
          fi
          chmod +x upload_blog_to_yandex.sh
          ./upload_blog_to_yandex.sh
      
      - name: Коммит изменений в репозиторий tabatatimer-ru
        working-directory: public_html
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_CROSS_REPO }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "⚠️ PAT_CROSS_REPO не задан — пропускаю push в tabatatimer-ru (файлы уже на Yandex Cloud)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/VR-Lounge/tabatatimer-ru.git
          
          if [ -n "$(git status --porcelain)" ]; then
            git add blog-posts.json blog/*.html sitemap.xml robots.txt images/blog/ 2>/dev/null || true
            git commit -m "🤖 Автообновление: новые посты блога $(date +'%Y-%m-%d %H:%M:%S')" || echo "⚠️ Нет изменений для коммита"
            if git push origin main; then
              echo "✅ Изменения успешно отправлены в tabatatimer-ru"
            else
              echo "❌ Не удалось запушить изменения в tabatatimer-ru"
              exit 1
            fi
          else
            echo "ℹ️ Нет изменений для коммита"
          fi
      
      - name: Сохранение состояния (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            fitness-timer-autopost/.menshealth_processed.json
            fitness-timer-autopost/.content_hashes.json
            fitness-timer-autopost/.telegram_recent.json
            fitness-timer-autopost/.publication_logs.json
          key: menshealth-state-${{ github.run_id }}
      
      - name: Логирование результата
        if: always()
        working-directory: fitness-timer-autopost
        run: |
          echo "📊 Результат выполнения парсера:"
          if [ -f .menshealth_processed.json ]; then
            echo "✅ Состояние сохранено"
          else
            echo "⚠️ Состояние не найдено"
          fi
